<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<style>
:root {
  --ibm-black: #161616;
  --text: #161616;
  --muted: #525252;
  --border: #e0e0e0;
  --blue: #0f62fe;
  --red: #ee0000;
  --layer: #f4f4f4;
  --callout-bg: #ddeeff;
  --callout-border: #4589ff;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  background: #ffffff;
}
[id] { scroll-margin-top: 64px; }

/* Masthead, in the spirit of the Redbooks site */
.masthead {
  position: sticky; top: 0; z-index: 10;
  height: 48px; background: var(--ibm-black); color: #fff;
  display: flex; align-items: center; padding: 0 1rem;
  border-bottom: 1px solid #393939;
}
.masthead .brand { font-weight: 600; letter-spacing: .02em; margin-right: 2rem; }
.masthead .brand span { color: var(--red); }
.masthead .crumb { color: #c6c6c6; font-size: .875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.layout { display: flex; align-items: flex-start; }

/* Left navigation tree */
nav#side {
  position: sticky; top: 48px;
  width: 22rem; flex: 0 0 22rem;
  height: calc(100vh - 48px); overflow-y: auto;
  border-right: 1px solid var(--border);
  background: var(--layer);
  padding: 1rem 0 2rem 0;
  font-size: .875rem;
}
nav#side .nav-title {
  padding: 0 1rem .5rem 1rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; font-size: .75rem; letter-spacing: .08em;
}
nav#side ul { list-style: none; margin: 0; padding: 0; }
nav#side li { margin: 0; }
nav#side a {
  display: block; padding: .3rem 1rem .3rem 1rem;
  color: var(--text); text-decoration: none; border-left: 3px solid transparent;
}
nav#side a:hover { background: #e8e8e8; border-left-color: var(--blue); }
nav#side > ul > li > a { font-weight: 600; padding-top: .5rem; }
nav#side ul ul a { padding-left: 1.75rem; font-weight: 400; }
nav#side ul ul ul a { padding-left: 2.75rem; font-size: .8125rem; color: var(--muted); }

main { flex: 1 1 auto; min-width: 0; padding: 0 3rem 4rem 3rem; max-width: 62rem; }

/* Title block */
.titleblock { padding: 2rem 0 .5rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
.titleblock .kicker { color: var(--muted); font-size: .875rem; text-transform: uppercase; letter-spacing: .08em; }
.titleblock h1.title { margin: .25rem 0 .5rem 0; font-size: 2.25rem; line-height: 1.2; border: 0; padding: 0; font-weight: 400; }
.titleblock .subtitle { color: var(--muted); margin: 0 0 1rem 0; }

/* Headings, matching the Redbooks content.css rules */
h1 { margin: 2rem 0 .75rem 0; padding-bottom: .2em; border-bottom: 2px solid var(--red); font-size: 1.875rem; font-weight: 400; line-height: 1.25; }
h2 { margin: 1.75rem 0 .6rem 0; padding-bottom: .2em; border-bottom: 1px solid #aaaaaa; font-size: 1.5rem; font-weight: 400; line-height: 1.3; }
h3 { margin: 1.25rem 0 .5rem 0; font-size: 1.125rem; font-weight: 600; }
h4 { margin: 1rem 0 .4rem 0; font-size: 1rem; font-weight: 600; }

p { margin: 0 0 1rem 0; max-width: 46rem; }
ul, ol { padding-left: 1.5rem; margin: 0 0 1rem 0; max-width: 46rem; }
li { margin: .25rem 0; }
li > p { margin-bottom: .5rem; }
li.task, ul.task-list { list-style: none; padding-left: .25rem; }
a { color: var(--blue); }
a:hover { color: #0043ce; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }

/* Inline code and code blocks */
code, pre { font-family: "IBM Plex Mono", Menlo, Consolas, "Courier New", monospace; }
code { background: var(--layer); padding: .05em .3em; font-size: .875em; }
pre {
  background: var(--layer); border-left: 3px solid #8d8d8d;
  padding: .85rem 1rem; margin: .5rem 0 1.25rem 0;
  overflow-x: auto; font-size: .8125rem; line-height: 1.5; max-width: 50rem;
}
pre code { background: transparent; padding: 0; font-size: inherit; white-space: pre-wrap; word-break: break-word; }

/* Tables, Carbon style */
.table-wrap { overflow-x: auto; margin: 1rem 0 1.5rem 0; }
table { border-collapse: collapse; width: 100%; font-size: .875rem; }
thead th {
  background: #e0e0e0; text-align: left; font-weight: 600;
  padding: .6rem .75rem; border-bottom: 2px solid #8d8d8d; vertical-align: bottom;
}
tbody td { padding: .55rem .75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr:nth-child(even) { background: #fafafa; }
tbody tr:hover { background: #e8e8e8; }

/* Callouts: blockquotes are rendered as informational notes */
blockquote {
  position: relative; margin: 1.25rem 0; max-width: 50rem;
  background: var(--callout-bg); border-left: 4px solid var(--callout-border);
  padding: 1rem 1rem 1rem 3.25rem;
}
blockquote::before {
  content: "i"; position: absolute; left: .85rem; top: 1rem;
  width: 1.5rem; height: 1.5rem; border-radius: 50%;
  background: var(--blue); color: #e8f1ff;
  font: italic 700 .95rem/1.5rem Georgia, serif; text-align: center;
}
blockquote p:last-child { margin-bottom: 0; }

footer.page-footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .8125rem; text-align: center; }

@media (max-width: 960px) {
  .layout { display: block; }
  nav#side { position: static; width: auto; height: auto; max-height: 22rem; border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 0 1rem 3rem 1rem; }
}
@media print {
  @page { size: A4; margin: 12mm; }
  .masthead, nav#side { display: none; }
  body { font-size: 9.5pt; line-height: 1.35; }
  main { padding: 0; max-width: none; }
  h1 { font-size: 17pt; margin: 14pt 0 6pt; }
  h2 { font-size: 12.5pt; margin: 10pt 0 4pt; }
  h3 { font-size: 10.5pt; margin: 8pt 0 3pt; }
  p, li { margin-top: 2pt; margin-bottom: 2pt; }
  table { font-size: 8.5pt; }
  th, td { padding: 2pt 5pt; }
  pre { font-size: 8pt; padding: 4pt 6pt; }
  pre, tr, blockquote { page-break-inside: avoid; }
  h1, h2, h3 { page-break-after: avoid; }
}
</style>
</head>
<body>
<header class="masthead">
  <div class="brand">IBM <span>Bob</span> | Practitioner's Guide</div>
  <div class="crumb">$pagetitle$</div>
</header>
<div class="layout">
<nav id="side" aria-label="Table of contents">
  <div class="nav-title">Contents</div>
$table-of-contents$
</nav>
<main>
<div class="titleblock">
  <div class="kicker">$kicker$</div>
  <h1 class="title">$title$</h1>
  <p class="subtitle">$subtitle$</p>
</div>
$body$
<footer class="page-footer">Made with IBM Bob</footer>
</main>
</div>
</body>
</html>
